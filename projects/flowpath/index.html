<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1C1B2E">
<title>Flowpath</title>
<meta name="description" content="Flowpath keeps every project on one board, one timeline and one activity log.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B4FE9'/%3E%3Cpath d='M8 22c4 0 4-12 8-12s4 12 8 12' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Design tokens */
:root {
  --zl-h: 32px;
  --bg: #F3F4F9;
  --surface: #FFFFFF;
  --sunken: #E9EAF2;
  --line: #DEDFEA;
  --line-strong: #9A9CB4;
  --ink: #1C1B2E;
  --ink-2: #4B4A64;
  --ink-3: #6E6D86;
  --accent: #5B4FE9;
  --accent-hover: #4A3FD1;
  --accent-soft: #ECEAFD;
  --accent-ink: #3E34B8;
  --green: #1F7A4D;
  --green-soft: #DFF3E7;
  --amber: #9A5B00;
  --amber-soft: #FDEFD2;
  --red: #B3261E;
  --red-soft: #FBE4E2;
  --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 8px;
}

/* Base */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main:focus { outline: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .95em; }

/* Zero Lag bar */
.zl-bar { flex: none; position: sticky; top: 0; z-index: 70; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--zl-h); padding: 0 14px; background: #1C1B2E; color: #B9B8CF; font-size: 13px; }
.zl-bar a { color: #DEDCFF; text-decoration: none; font-weight: 600; white-space: nowrap; }
.zl-bar a:hover { text-decoration: underline; }
.zl-bar a:focus-visible { outline-color: #DEDCFF; }
.zl-bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zl-bar strong { color: #fff; font-weight: 600; }

/* App shell */
.skip { position: absolute; left: 8px; top: calc(var(--zl-h) + 8px); z-index: 50; background: var(--surface); padding: 8px 12px; border-radius: var(--radius); transform: translateY(-300%); }
.skip:focus { transform: none; }
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
.sidebar { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px; }
.brand b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.brand span { display: block; font-size: 12px; color: var(--ink-3); }
.proj-pick { padding: 4px 12px 10px; }
.proj-pick label { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.nav { padding: 6px 8px; display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: var(--radius); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.nav svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav .count { margin-left: auto; font: 500 12px var(--mono); color: var(--ink-3); }
.side-foot { margin-top: auto; padding: 10px 14px 12px; border-top: 1px solid var(--line); display: flex; gap: 9px; align-items: center; }
.side-foot b { display: block; font-weight: 600; font-size: 13px; line-height: 1.2; }
.side-foot span.role { display: block; font-size: 12px; color: var(--ink-3); }
.scrim { display: none; }
.workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 20px; background: var(--surface); border-bottom: 1px solid var(--line); min-height: 52px; }
.topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.topbar .crumb { color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.menu-btn { display: none; }
main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 20px 28px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 5px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.danger:hover { background: var(--red-soft); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.icon { padding: 0; width: 32px; }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); min-height: 28px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg button:focus-visible { outline-offset: -3px; box-shadow: inset 0 0 0 1px #fff; }
.field { display: grid; gap: 3px; min-width: 0; }
.field > label, .label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
input[type=text], input[type=search], input[type=date], input[type=number], select, textarea { width: 100%; min-height: 32px; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: #fff; }
textarea { resize: vertical; min-height: 60px; display: block; }
[aria-invalid="true"] { border-color: var(--red) !important; box-shadow: inset 0 0 0 1px var(--red); }
.err { color: var(--red); font-size: 12.5px; font-weight: 500; }
.err[hidden] { display: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
.toolbar .field.grow { flex: 1 1 200px; max-width: 320px; }
.toolbar .field.fix { flex: 0 0 160px; }
.toolbar .tally { margin-left: auto; color: var(--ink-3); font-size: 13px; padding-bottom: 7px; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.pane-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.pane-head h2 { font-size: 14px; font-weight: 700; }
.pane-head .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.empty { padding: 22px 14px; color: var(--ink-3); text-align: center; }

/* Avatars, labels and badges */
.av { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff; background: var(--ink-2); letter-spacing: .01em; }
.av.sm { width: 22px; height: 22px; font-size: 10px; }
.av.lg { width: 38px; height: 38px; font-size: 14px; }
.lbl { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--sunken); color: var(--ink-2); }
.lbl.design { background: #FBE4F1; color: #8A1E5C; }
.lbl.frontend { background: #E3EEFD; color: #1D4F9C; }
.lbl.backend { background: #E6F2EA; color: #1F6A3F; }
.lbl.content { background: #FDF0D6; color: #7A4F00; }
.lbl.qa { background: #ECEAFD; color: #3E34B8; }
.lbl.infra { background: #E4E6EC; color: #3C4257; }
.lbl.research { background: #E2F4F3; color: #0B5F5C; }
.lbl.marketing { background: #FDE6DB; color: #8B3A12; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--sunken); color: var(--ink-2); }
.badge.doing { background: var(--accent-soft); color: var(--accent-ink); }
.badge.review { background: var(--amber-soft); color: var(--amber); }
.badge.done { background: var(--green-soft); color: var(--green); }
.badge.todo { background: #E3EEFD; color: #1D4F9C; }
.pri { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.pri i { width: 8px; height: 8px; border-radius: 2px; background: var(--line-strong); }
.pri.high i { background: var(--red); }
.pri.medium i { background: var(--amber); }
.pri.low i { background: var(--green); }
.due { font-size: 12px; color: var(--ink-3); white-space: nowrap; font-weight: 500; }
.due.over { color: var(--red); font-weight: 600; }
.due.soon { color: var(--amber); font-weight: 600; }
.prog { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.prog .bar { width: 44px; height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--accent); }
.prog.full .bar i { background: var(--green); }

/* Board */
.board-bar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: flex-end; margin-bottom: 12px; }
.stat .label { display: block; }
.stat b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.board-bar .field { margin-left: auto; width: 180px; }
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; align-items: stretch; min-height: 0; }
.col { flex: 1 0 200px; min-width: 200px; background: var(--sunken); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 360px; border: 1px solid transparent; }
.col.over { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.col-head { padding: 9px 10px 6px; display: flex; align-items: center; gap: 7px; }
.col-head h2 { font-size: 13px; font-weight: 700; }
.col-head .wip { font: 500 12px var(--mono); color: var(--ink-3); }
.col-head .wip.full { color: var(--amber); font-weight: 600; }
.col-head .wip.overlimit { color: var(--red); font-weight: 600; }
.col-head .add { margin-left: auto; width: 26px; height: 26px; min-height: 0; padding: 0; background: transparent; border-color: transparent; color: var(--ink-3); }
.col-head .add:hover { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.col-note { padding: 0 10px 6px; font-size: 11.5px; color: var(--red); font-weight: 600; }
.cards { flex: 1; display: flex; flex-direction: column; gap: 7px; padding: 0 7px 7px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; cursor: grab; display: grid; gap: 5px; text-align: left; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; box-shadow: 0 1px 0 rgba(28, 27, 46, .04); }
.card:hover { border-color: var(--line-strong); }
.card.drag { opacity: .35; }
.card.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 40% { background: var(--accent-soft); border-color: var(--accent); } 100% { background: var(--surface); } }
.card .labels { display: flex; flex-wrap: wrap; gap: 4px; }
.card h3 { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.card .foot { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
.card .foot .due { margin-left: auto; }
.card .key { font: 500 11px var(--mono); color: var(--ink-3); white-space: nowrap; }
.card .foot { flex-wrap: wrap; }
.ghost { position: fixed; z-index: 80; pointer-events: none; box-shadow: 0 12px 28px rgba(28, 27, 46, .22); transform: rotate(1.5deg); cursor: grabbing; }
body.dragging, body.dragging * { cursor: grabbing !important; }
.col-empty { flex: 1; min-height: 72px; display: grid; place-items: center; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--ink-3); font-size: 12.5px; text-align: center; padding: 8px; }

/* Timeline */
.tl-wrap { overflow-x: auto; }
.tl { min-width: 760px; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.tl-head { display: contents; }
.tl-head > div { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); }
.tl-weeks { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.tl-weeks div { padding: 8px 8px 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); border-left: 1px solid var(--line); line-height: 1.25; }
.tl-weeks div small { display: block; font-weight: 500; color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
.tl-weeks div.now { color: var(--accent-ink); }
.tl-corner { padding: 10px 14px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.tl-group { grid-column: 1 / -1; background: var(--bg); padding: 5px 14px; font-size: 12px; font-weight: 700; color: var(--ink-3); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
.tl-label { padding: 7px 10px 7px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; min-width: 0; }
.tl-label button { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.tl-label button:hover { color: var(--accent-ink); text-decoration: underline; }
.tl-track { position: relative; border-bottom: 1px solid var(--line); background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 12.5%); min-height: 40px; }
.tl-track::before { content: ""; position: absolute; inset: 0; background-image: repeating-linear-gradient(to right, transparent 0 calc(100% / 56 * 5), rgba(28, 27, 46, .035) calc(100% / 56 * 5) calc(100% / 56 * 7)); pointer-events: none; }
.tl-bar { position: absolute; top: 9px; height: 22px; border-radius: 5px; background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-ink); font-size: 11.5px; font-weight: 600; padding: 0 7px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; text-align: left; min-width: 10px; }
.tl-bar.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.tl-bar.review { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.tl-bar.backlog, .tl-bar.todo { background: var(--surface); border-color: var(--line-strong); color: var(--ink-2); }
.tl-bar.late { border-style: dashed; }
.tl-bar i { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(91, 79, 233, .22); pointer-events: none; }
.tl-bar.done i { background: rgba(31, 122, 77, .18); }
.tl-bar.review i { background: rgba(154, 91, 0, .16); }
.tl-today { position: absolute; display: block; top: 0; bottom: 0; width: 2px; background: var(--red); z-index: 1; pointer-events: none; }
.tl-weeks { position: relative; }
.tl-weeks .tl-today { height: 100%; }
.tl-weeks .tl-today::after { content: "Today"; position: absolute; top: 3px; right: 5px; font-size: 10px; font-weight: 700; color: var(--red); }
.tl-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); }
.tl-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid; }

/* List */
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--ink-2); background: #F7F7FB; white-space: nowrap; }
th, td { padding: 7px 12px; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
.tasks-table { min-width: 860px; }
.tasks-table tbody tr { cursor: pointer; }
.tasks-table tbody tr:hover td { background: #F7F7FB; }
.tasks-table td { white-space: nowrap; }
.tasks-table td.title { white-space: normal; min-width: 240px; font-weight: 500; }
.tasks-table .who { display: flex; align-items: center; gap: 7px; }
th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: inline-flex; align-items: center; gap: 3px; }
th button:hover { color: var(--ink); text-decoration: underline; }
th[aria-sort] button { color: var(--ink); font-weight: 700; }
.arrow { font-size: 10px; width: 9px; display: inline-block; }

/* Activity */
.feed-day { font-size: 12px; font-weight: 700; color: var(--ink-3); padding: 10px 14px 4px; text-transform: uppercase; letter-spacing: .05em; }
.feed li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: 0; }
.feed .txt { flex: 1; min-width: 0; font-size: 13.5px; }
.feed .txt b { font-weight: 600; }
.feed .txt .t { color: var(--accent-ink); font-weight: 600; }
.feed .when { color: var(--ink-3); font-size: 12px; white-space: nowrap; font-family: var(--mono); padding-top: 2px; }

/* Settings */
.settings { display: grid; gap: 12px; max-width: 640px; }
.settings .pane-body { padding: 12px 14px; display: grid; gap: 10px; }
.wip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.settings p { color: var(--ink-2); font-size: 13.5px; }

/* Dialogs */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--surface); }
dialog::backdrop { background: rgba(28, 27, 46, .32); }
.modal { position: fixed; inset: calc(var(--zl-h) + 12px) 0 12px 0; margin: auto; width: min(620px, calc(100vw - 24px)); height: fit-content; max-height: calc(100dvh - var(--zl-h) - 24px); border-radius: 10px; overflow-y: auto; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-head .key { font: 500 12px var(--mono); color: var(--ink-3); }
.modal-head h2 { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px 16px; }
.form-grid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 6px; border: 1px solid var(--line-strong); border-radius: 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: var(--surface); }
.chips label:has(:checked) { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips input { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); }
.check { display: grid; gap: 4px; }
.check li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.check li:last-child { border-bottom: 0; }
.check input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: none; }
.check label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.check .done label { text-decoration: line-through; color: var(--ink-3); }
.check .rm { border: 0; background: none; color: var(--ink-3); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; }
.check .rm:hover { background: var(--red-soft); color: var(--red); }
.check .rm svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.check-add { display: flex; gap: 6px; margin-top: 6px; }
.check-add input { flex: 1; }
.modal-foot { display: flex; gap: 8px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); background: #F7F7FB; }
.modal-foot .spacer { flex: 1; }
.hint { font-size: 12.5px; color: var(--ink-3); }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); background: var(--ink); color: #fff; padding: 8px 12px; border-radius: var(--radius); display: flex; gap: 12px; align-items: center; z-index: 90; font-size: 13.5px; }
.toast[hidden] { display: none; }
.toast button { border: 0; background: none; padding: 2px; color: #C9C4FF; font-weight: 700; text-decoration: underline; }

/* Tablet and phone layout */
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; top: var(--zl-h); bottom: 0; left: 0; width: 260px; max-width: 84vw; z-index: 30; transform: translateX(-102%); visibility: hidden; transition: transform .18s ease-out, visibility .18s; box-shadow: 0 0 0 1px var(--line); }
  .sidebar.open { transform: none; visibility: visible; }
  .scrim.open { display: block; position: fixed; inset: var(--zl-h) 0 0 0; background: rgba(28, 27, 46, .32); z-index: 20; }
  .nav a { min-height: 44px; }
  .menu-btn { display: inline-flex; width: 44px; height: 44px; margin-left: -8px; border: 0; background: none; align-items: center; justify-content: center; border-radius: var(--radius); flex: none; }
  .menu-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .topbar { padding: 3px 12px; gap: 6px; }
  .topbar .crumb { display: none; }
  main { padding: 12px 12px 72px; }
  .btn { min-height: 44px; }
  .btn.icon { width: 44px; }
  .seg button { min-height: 38px; padding: 3px 12px; }
  input[type=text], input[type=search], input[type=date], input[type=number], select, textarea { font-size: 16px; min-height: 44px; }
  .col-head .add { width: 40px; height: 40px; margin: -6px -4px -6px auto; }
  .board { scroll-snap-type: x proximity; margin: 0 -12px; padding: 0 12px 8px; scroll-padding-left: 12px; }
  .col { flex: 0 0 min(80vw, 280px); min-width: 0; scroll-snap-align: start; }
  .board-bar .field { margin-left: 0; width: 100%; }
  .toolbar .field.grow { max-width: none; flex-basis: 100%; }
  .toolbar .field.fix { flex: 1 1 130px; }
  .tasks-table th:first-child, .tasks-table td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
  .check .rm { width: 40px; height: 40px; }
  .check input[type=checkbox] { width: 20px; height: 20px; }
  .wip-grid { grid-template-columns: minmax(0, 1fr); }
}

/* Small phone layout */
@media (max-width: 520px) {
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .form-grid .full { grid-column: auto; }
  .board-bar { gap: 6px 16px; }
  .stat b { font-size: 16px; }
  .modal-foot { flex-wrap: wrap; }
  .tl { grid-template-columns: 150px minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .zl-bar span { display: none; }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

<script>
const DAY = 86400000;
const STORE = 'flowpath.v1';
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => new Date(s + 'T00:00:00');
const inDays = n => iso(addDays(TODAY, n));
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
const fmtDay = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
const fmtTime = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit' });
const fmtLong = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

const ME = 'PR';
const MEMBERS = {
  PR: { name: 'Priya Raman', role: 'Delivery lead', color: '#5B4FE9' },
  JW: { name: 'Jonas Weber', role: 'Frontend engineer', color: '#1D4F9C' },
  AO: { name: 'Amara Osei', role: 'Product designer', color: '#8A1E5C' },
  FL: { name: 'Felix Lindqvist', role: 'Backend engineer', color: '#1F6A3F' },
  SM: { name: 'Sofia Marchetti', role: 'Content strategist', color: '#9A5B00' },
  DK: { name: 'Daniel Kim', role: 'QA engineer', color: '#0B5F5C' }
};
const LABELS = ['design', 'frontend', 'backend', 'content', 'qa', 'infra', 'research', 'marketing'];
const COLUMNS = [
  { id: 'backlog', name: 'Backlog' },
  { id: 'todo', name: 'To do' },
  { id: 'doing', name: 'In progress' },
  { id: 'review', name: 'In review' },
  { id: 'done', name: 'Done' }
];
const PRIORITIES = ['low', 'medium', 'high'];

// Seed data is built relative to today so dates always look current
function seed() {
  const projects = [
    { id: 'web', key: 'WEB', name: 'Website relaunch', wip: { doing: 4, review: 3 } },
    { id: 'mob', key: 'MOB', name: 'Mobile app 2.0', wip: { doing: 3, review: 2 } },
    { id: 'bil', key: 'BIL', name: 'Billing platform migration', wip: { doing: 4, review: 3 } }
  ];
  // Each row: project, title, status, assignee, start offset, due offset, labels, priority, checklist
  const rows = [
    ['web', 'Audit current site analytics and top landing pages', 'done', 'SM', -34, -27, ['research'], 'medium', ['x Export GA4 report', 'x Rank pages by exits', 'x Share summary in Notion']],
    ['web', 'Define information architecture for new navigation', 'done', 'AO', -30, -22, ['design', 'research'], 'high', ['x Card sort with 6 users', 'x Draft sitemap v2', 'x Review with Priya']],
    ['web', 'Design system tokens: colour, type, spacing', 'done', 'AO', -26, -18, ['design'], 'high', ['x Colour palette', 'x Type scale', 'x Spacing scale', 'x Figma variables']],
    ['web', 'Set up Next.js project with CI preview deploys', 'done', 'JW', -24, -19, ['frontend', 'infra'], 'medium', ['x Repo scaffold', 'x Vercel previews', 'x Lint and format hooks']],
    ['web', 'Home page hero and value proposition copy', 'review', 'SM', -12, -1, ['content'], 'high', ['x First draft', 'x Legal review', 'Final headline options']],
    ['web', 'Build responsive header and mega-menu', 'doing', 'JW', -9, 3, ['frontend'], 'high', ['x Desktop layout', 'x Keyboard navigation', 'Mobile drawer', 'Focus trap tests']],
    ['web', 'Pricing page layout with plan comparison table', 'doing', 'AO', -6, 5, ['design'], 'medium', ['x Wireframe', 'Hi-fi desktop', 'Hi-fi mobile']],
    ['web', 'Case study template and CMS schema', 'doing', 'FL', -5, 6, ['backend', 'content'], 'medium', ['x Sanity schema', 'Preview mode', 'Migrate 8 case studies']],
    ['web', 'Contact form with spam protection and CRM webhook', 'todo', 'FL', 2, 9, ['backend'], 'medium', ['Turnstile integration', 'HubSpot webhook', 'Error states']],
    ['web', 'Image pipeline: AVIF, responsive sizes, lazy loading', 'todo', 'JW', 4, 12, ['frontend', 'infra'], 'low', ['next/image config', 'Audit largest images']],
    ['web', 'Accessibility pass: contrast, landmarks, focus order', 'todo', 'DK', 8, 15, ['qa'], 'high', ['axe scan', 'Screen reader walkthrough', 'Fix list triage']],
    ['web', 'Blog listing and article page templates', 'todo', 'AO', 6, 16, ['design', 'frontend'], 'medium', []],
    ['web', 'SEO redirects map from legacy URLs', 'backlog', 'SM', 10, 20, ['content', 'infra'], 'high', ['Crawl old site', 'Map 301s', 'Validate in staging']],
    ['web', 'Launch checklist and rollback plan', 'backlog', 'PR', 18, 26, ['infra'], 'high', ['DNS cutover steps', 'Monitoring alerts', 'Rollback rehearsal']],
    ['web', 'Cross-browser QA on Safari, Firefox and Edge', 'backlog', 'DK', 16, 24, ['qa'], 'medium', []],
    ['web', 'Newsletter signup with double opt-in', 'backlog', 'FL', 20, 27, ['backend', 'marketing'], 'low', []],
    ['web', 'Performance budget and Lighthouse CI gate', 'review', 'JW', -8, -2, ['frontend', 'infra'], 'medium', ['x Budget JSON', 'x CI action', 'Document thresholds']],
    ['mob', 'Interview 8 customers about offline usage', 'done', 'AO', -32, -24, ['research'], 'high', ['x Recruit', 'x Run sessions', 'x Synthesis board']],
    ['mob', 'Define 2.0 scope and release milestones', 'done', 'PR', -28, -23, ['research'], 'high', ['x Scope doc', 'x Milestone dates', 'x Stakeholder sign-off']],
    ['mob', 'Upgrade to React Native 0.76 and new architecture', 'done', 'JW', -22, -14, ['frontend', 'infra'], 'high', ['x Dependency audit', 'x Migrate native modules', 'x Smoke test on 6 devices']],
    ['mob', 'Offline-first sync engine with conflict resolution', 'doing', 'FL', -10, 8, ['backend'], 'high', ['x Local store schema', 'x Change log', 'Conflict policy', 'Retry with backoff']],
    ['mob', 'Redesigned onboarding flow (4 screens)', 'doing', 'AO', -7, 4, ['design'], 'medium', ['x Flow map', 'x Screens 1 to 2', 'Screens 3 to 4', 'Motion spec']],
    ['mob', 'Biometric login on iOS and Android', 'doing', 'JW', -4, 7, ['frontend'], 'medium', ['x Face ID', 'Android BiometricPrompt', 'Fallback to PIN']],
    ['mob', 'Push notification preferences screen', 'review', 'JW', -9, -1, ['frontend'], 'low', ['x UI', 'x Persist settings', 'QA on Android 14']],
    ['mob', 'Crash reporting and release health dashboard', 'todo', 'DK', 3, 10, ['qa', 'infra'], 'medium', ['Sentry SDK', 'Alert rules']],
    ['mob', 'App store screenshots and listing copy', 'todo', 'SM', 9, 17, ['marketing', 'content'], 'medium', ['6.7 inch set', '6.1 inch set', 'Localised copy for DE and FR']],
    ['mob', 'Dark mode across all screens', 'todo', 'AO', 7, 18, ['design', 'frontend'], 'low', []],
    ['mob', 'Beta programme with 200 TestFlight users', 'backlog', 'PR', 14, 24, ['research'], 'high', ['Recruit from waitlist', 'Feedback form', 'Weekly digest']],
    ['mob', 'Accessibility: dynamic type and VoiceOver labels', 'backlog', 'DK', 12, 21, ['qa'], 'high', []],
    ['mob', 'Deep links and universal links', 'backlog', 'FL', 18, 26, ['backend', 'frontend'], 'medium', []],
    ['bil', 'Inventory of legacy invoice tables and jobs', 'done', 'FL', -36, -29, ['backend', 'research'], 'high', ['x Schema dump', 'x Cron job list', 'x Owners identified']],
    ['bil', 'Target architecture and data model review', 'done', 'FL', -28, -21, ['backend'], 'high', ['x ERD', 'x Review with finance', 'x Decision log']],
    ['bil', 'Stripe Billing account setup and tax configuration', 'done', 'PR', -24, -18, ['backend'], 'medium', ['x Account', 'x Tax rates', 'x Test clocks']],
    ['bil', 'Customer and subscription migration scripts', 'doing', 'FL', -12, 6, ['backend'], 'high', ['x Customers', 'x Payment methods', 'Subscriptions with proration', 'Dry run on staging']],
    ['bil', 'Invoice PDF template with new brand', 'doing', 'AO', -5, 3, ['design', 'content'], 'medium', ['x Layout', 'Localised number formats']],
    ['bil', 'Dunning emails: 3 reminder sequence', 'review', 'SM', -10, -2, ['content', 'marketing'], 'medium', ['x Copy', 'x Templates', 'Finance approval']],
    ['bil', 'Webhook consumer for payment events', 'review', 'JW', -8, 1, ['backend'], 'high', ['x Idempotency keys', 'x Retry queue', 'Load test at 50 rps']],
    ['bil', 'Customer portal: update card and download invoices', 'todo', 'JW', 2, 12, ['frontend'], 'high', ['Portal session', 'Invoice list', 'Card update']],
    ['bil', 'Reconciliation report for finance team', 'todo', 'FL', 5, 14, ['backend'], 'medium', ['Daily job', 'CSV export', 'Variance alerts']],
    ['bil', 'Regression suite for proration edge cases', 'todo', 'DK', 6, 13, ['qa'], 'high', ['Mid-cycle upgrade', 'Downgrade with credit', 'Cancel at period end']],
    ['bil', 'Cutover runbook and freeze window', 'backlog', 'PR', 16, 25, ['infra'], 'high', ['Freeze comms', 'Step list', 'Go or no-go call']],
    ['bil', 'Decommission legacy billing cron jobs', 'backlog', 'FL', 24, 30, ['backend', 'infra'], 'low', []],
    ['bil', 'Help centre articles for new invoices', 'backlog', 'SM', 14, 22, ['content'], 'low', []]
  ];
  let n = 100;
  const tasks = rows.map(r => ({
    id: 't' + (++n), project: r[0], title: r[1], status: r[2], assignee: r[3], start: inDays(r[4]), due: inDays(r[5]), labels: r[6], priority: r[7],
    checklist: r[8].map((c, i) => ({ id: 'c' + n + '_' + i, text: c.replace(/^x /, ''), done: c.startsWith('x ') })),
    created: Date.parse(inDays(r[4] - 3)) + 9 * 3600000
  }));
  const activity = [];
  const at = (daysAgo, h) => Date.parse(inDays(-daysAgo)) + h * 3600000;
  const push = (daysAgo, h, who, project, text) => activity.push({ id: 'a' + activity.length, at: at(daysAgo, h), who, project, text });
  push(6, 10, 'AO', 'web', 'moved <b>Design system tokens: colour, type, spacing</b> to <span class="t">Done</span>');
  push(5, 9, 'JW', 'web', 'completed 2 checklist items on <b>Build responsive header and mega-menu</b>');
  push(5, 14, 'SM', 'web', 'moved <b>Home page hero and value proposition copy</b> to <span class="t">In review</span>');
  push(4, 11, 'FL', 'mob', 'moved <b>Offline-first sync engine with conflict resolution</b> to <span class="t">In progress</span>');
  push(4, 16, 'PR', 'bil', 'changed due date on <b>Customer and subscription migration scripts</b> to ' + fmtDay.format(parse(inDays(6))));
  push(3, 9, 'DK', 'web', 'created <b>Accessibility pass: contrast, landmarks, focus order</b>');
  push(3, 13, 'JW', 'bil', 'moved <b>Webhook consumer for payment events</b> to <span class="t">In review</span>');

  push(2, 15, 'SM', 'bil', 'moved <b>Dunning emails: 3 reminder sequence</b> to <span class="t">In review</span>');

  push(1, 11, 'FL', 'mob', 'completed 1 checklist item on <b>Offline-first sync engine with conflict resolution</b>');
  push(1, 16, 'PR', 'web', 'added label <b>infra</b> to <b>SEO redirects map from legacy URLs</b>');
  push(0, 8, 'AO', 'web', 'completed 1 checklist item on <b>Pricing page layout with plan comparison table</b>');

}

// Persistence
let DB;
function load() {
  try { const raw = localStorage.getItem(STORE); if (raw) { DB = JSON.parse(raw); return; } } catch (e) { }
  DB = seed();
  save();
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(DB)); } catch (e) { } }

const state = { view: 'board', boardFilter: 'all', search: '', listFilter: 'open', sortKey: 'due', sortDir: 1, editing: null, flash: null, activityFilter: 'all' };

const project = () => DB.projects.find(p => p.id === DB.project);
const projTasks = () => DB.tasks.filter(t => t.project === DB.project);
const task = id => DB.tasks.find(t => t.id === id);
const colName = id => COLUMNS.find(c => c.id === id).name;
const progress = t => t.checklist.length ? Math.round(t.checklist.filter(c => c.done).length / t.checklist.length * 100) : null;
const taskKey = t => `${DB.projects.find(p => p.id === t.project).key}-${t.id.slice(1)}`;

// Activity logging for every change
function log(text, projectId = DB.project) {
  DB.activity.push({ id: 'a' + Date.now() + Math.random().toString(36).slice(2, 6), at: Date.now(), who: ME, project: projectId, text });
  if (DB.activity.length > 400) DB.activity.splice(0, DB.activity.length - 400);
}

// Shared pieces
const avatar = (id, cls = '') => { const m = MEMBERS[id]; return `<span class="av ${cls}" style="background:${m.color}" title="${esc(m.name)}" aria-label="${esc(m.name)}">${id}</span>`; };
const labelChips = ls => ls.map(l => `<span class="lbl ${l}">${l}</span>`).join('');
function dueChip(t) {
  if (t.status === 'done') return `<span class="due">Done</span>`;
  const d = daysBetween(iso(TODAY), t.due);
  const cls = d < 0 ? 'over' : d <= 2 ? 'soon' : '';
  const txt = d < 0 ? `${-d}d overdue` : d === 0 ? 'Due today' : fmtDay.format(parse(t.due));
  return `<span class="due ${cls}">${txt}</span>`;
}
function progChip(t) {
  const p = progress(t);
  if (p === null) return '';
  const done = t.checklist.filter(c => c.done).length;
  return `<span class="prog ${p === 100 ? 'full' : ''}" title="${done} of ${t.checklist.length} checklist items done"><span class="bar"><i style="width:${p}%"></i></span>${done}/${t.checklist.length}</span>`;
}
const priChip = p => `<span class="pri ${p}"><i></i>${p[0].toUpperCase() + p.slice(1)}</span>`;

function cardHTML(t) {
  return `<article class="card${state.flash === t.id ? ' flash' : ''}" data-task="${t.id}" tabindex="0" role="button" aria-label="${esc(t.title)}, ${colName(t.status)}, open details">
    ${t.labels.length ? `<div class="labels">${labelChips(t.labels)}</div>` : ''}
    <h3>${esc(t.title)}</h3>
    <div class="foot">${avatar(t.assignee, 'sm')}<span class="key">${taskKey(t)}</span>${progChip(t)}${dueChip(t)}</div>
  </article>`;
}

// Board view
function viewBoard() {
  const p = project();
  const all = projTasks();
  const visible = all.filter(t => state.boardFilter === 'all' || (state.boardFilter === 'mine' ? t.assignee === ME : t.assignee === state.boardFilter));
  const open = all.filter(t => t.status !== 'done');
  const overdue = open.filter(t => parse(t.due) < TODAY).length;
  const done = all.length - open.length;
  const members = [...new Set(all.map(t => t.assignee))];
  return `
  <div class="board-bar">
    <div class="stat"><span class="label">Open tasks</span><b>${open.length}</b></div>
    <div class="stat"><span class="label">Overdue</span><b style="${overdue ? 'color:var(--red)' : ''}">${overdue}</b></div>
    <div class="stat"><span class="label">Completed</span><b>${done} <span style="font-size:13px;color:var(--ink-3);font-weight:500">of ${all.length}</span></b></div>
    <div class="field"><label for="boardFilter">Show</label><select id="boardFilter"><option value="all"${state.boardFilter === 'all' ? ' selected' : ''}>Everyone</option><option value="mine"${state.boardFilter === 'mine' ? ' selected' : ''}>Assigned to me</option>${members.map(m => `<option value="${m}"${state.boardFilter === m ? ' selected' : ''}>${esc(MEMBERS[m].name)}</option>`).join('')}</select></div>
  </div>
  <div class="board" id="board">${COLUMNS.map(c => {
    const inCol = visible.filter(t => t.status === c.id).sort((a, b) => a.due.localeCompare(b.due));
    const total = all.filter(t => t.status === c.id).length;
    const lim = p.wip[c.id];
    const wipCls = lim ? (total > lim ? 'overlimit' : total === lim ? 'full' : '') : '';
    return `<section class="col" data-col="${c.id}" aria-labelledby="col-${c.id}">
      <div class="col-head"><h2 id="col-${c.id}">${c.name}</h2><span class="wip ${wipCls}" title="${lim ? 'Work in progress limit ' + lim : 'No limit'}">${total}${lim ? '/' + lim : ''}</span><button class="btn add" type="button" data-act="new-task" data-status="${c.id}" aria-label="Add task to ${c.name}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button></div>
      ${lim && total > lim ? `<div class="col-note">Over WIP limit by ${total - lim}</div>` : ''}
      <div class="cards">${inCol.length ? inCol.map(cardHTML).join('') : `<div class="col-empty">${visible.length === all.length ? 'Drop a task here' : 'Nothing here for this filter'}</div>`}</div>
    </section>`;
  }).join('')}</div>`;
}

// Timeline view
function viewTimeline() {
  const monday = addDays(TODAY, -((TODAY.getDay() + 6) % 7) - 7);
  const start = iso(monday);
  const span = 56;
  const weeks = Array.from({ length: 8 }, (_, i) => addDays(monday, i * 7));
  const tasks = projTasks().filter(t => daysBetween(start, t.due) >= -2 && daysBetween(start, t.start) < span).sort((a, b) => a.start.localeCompare(b.start));
  const groups = COLUMNS.map(c => ({ c, rows: tasks.filter(t => t.status === c.id) })).filter(g => g.rows.length);
  const todayPct = (daysBetween(start, iso(TODAY)) + 0.5) / span * 100;
  const row = t => {
    const s = Math.max(0, daysBetween(start, t.start));
    const e = Math.min(span, daysBetween(start, t.due) + 1);
    const late = t.status !== 'done' && parse(t.due) < TODAY;
    const p = progress(t);
    return `<div class="tl-label">${avatar(t.assignee, 'sm')}<button type="button" data-act="open-task" data-id="${t.id}">${esc(t.title)}</button></div>
    <div class="tl-track"><button type="button" class="tl-bar ${t.status}${late ? ' late' : ''}" data-act="open-task" data-id="${t.id}" style="left:${s / span * 100}%;width:${Math.max(e - s, 0.6) / span * 100}%" title="${esc(t.title)}: ${fmtDay.format(parse(t.start))} to ${fmtDay.format(parse(t.due))}">${p !== null ? `<i style="width:${p}%"></i>` : ''}<span style="position:relative">${esc(t.title)}</span></button><div class="tl-today" style="left:${todayPct}%"></div></div>`;
  };
  return `<section class="pane" aria-label="Timeline">
    <div class="pane-head"><h2>${esc(project().name)}: next 8 weeks</h2><span class="hint">${tasks.length} scheduled tasks, from ${fmtDay.format(monday)} to ${fmtDay.format(addDays(monday, 55))}</span></div>
    <div class="tl-wrap"><div class="tl">
      <div class="tl-head"><div class="tl-corner">Task</div><div class="tl-weeks">${weeks.map((w, i) => `<div class="${TODAY >= w && TODAY < addDays(w, 7) ? 'now' : ''}">Week ${i + 1}<small>${fmtDay.format(w)}</small></div>`).join('')}<span class="tl-today" style="left:${todayPct}%"></span></div></div>
      ${groups.map(g => `<div class="tl-group">${g.c.name} (${g.rows.length})</div>${g.rows.map(row).join('')}`).join('')}
      ${tasks.length ? '' : '<div class="tl-group">No tasks fall in this window.</div>'}
    </div></div>
    <div class="tl-legend"><span><i style="background:var(--surface);border-color:var(--line-strong)"></i>Planned</span><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>In progress</span><span><i style="background:var(--amber-soft);border-color:var(--amber)"></i>In review</span><span><i style="background:var(--green-soft);border-color:var(--green)"></i>Done</span><span><i style="border-style:dashed;border-color:var(--red)"></i>Past due</span><span>Shaded fill shows checklist progress</span></div>
  </section>`;
}

// List view
function viewList() {
  const cols = [['title', 'Task'], ['status', 'Status'], ['assignee', 'Assignee'], ['priority', 'Priority'], ['due', 'Due'], ['progress', 'Checklist']];
  const th = (k, n) => `<th${state.sortKey === k ? ` aria-sort="${state.sortDir > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" data-act="sort" data-key="${k}">${n}<span class="arrow" aria-hidden="true">${state.sortKey === k ? (state.sortDir > 0 ? '▲' : '▼') : ''}</span></button></th>`;
  return `<div class="toolbar">
    <div class="field grow"><label for="listSearch">Search</label><input type="search" id="listSearch" value="${esc(state.search)}" autocomplete="off"></div>
    <div class="field fix"><label for="listFilter">Status</label><select id="listFilter"><option value="open"${state.listFilter === 'open' ? ' selected' : ''}>Open</option><option value="all"${state.listFilter === 'all' ? ' selected' : ''}>All</option>${COLUMNS.map(c => `<option value="${c.id}"${state.listFilter === c.id ? ' selected' : ''}>${c.name}</option>`).join('')}</select></div>
    <span class="tally" id="listTally"></span>
  </div>
  <section class="pane scroll-x"><table class="tasks-table"><thead><tr>${cols.map(c => th(...c)).join('')}</tr></thead><tbody id="listBody"></tbody></table></section>`;
}
function listRows() {
  const q = state.search.trim().toLowerCase();
  let rows = projTasks().filter(t => state.listFilter === 'all' || (state.listFilter === 'open' ? t.status !== 'done' : t.status === state.listFilter));
  if (q) rows = rows.filter(t => t.title.toLowerCase().includes(q) || t.labels.some(l => l.includes(q)) || MEMBERS[t.assignee].name.toLowerCase().includes(q));
  const order = { backlog: 0, todo: 1, doing: 2, review: 3, done: 4 };
  const pOrder = { low: 0, medium: 1, high: 2 };
  rows.sort((a, b) => {
    const k = state.sortKey; let v;
    if (k === 'status') v = order[a.status] - order[b.status];
    else if (k === 'priority') v = pOrder[a.priority] - pOrder[b.priority];
    else if (k === 'assignee') v = MEMBERS[a.assignee].name.localeCompare(MEMBERS[b.assignee].name);
    else if (k === 'progress') v = (progress(a) ?? -1) - (progress(b) ?? -1);
    else v = String(a[k]).localeCompare(String(b[k]));
    return v * state.sortDir || a.title.localeCompare(b.title);
  });
  $('#listBody').innerHTML = rows.length ? rows.map(t => `<tr data-row="${t.id}" tabindex="0"><td class="title">${esc(t.title)}<div class="labels" style="margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">${labelChips(t.labels)}</div></td><td><span class="badge ${t.status}">${colName(t.status)}</span></td><td><span class="who">${avatar(t.assignee, 'sm')}${esc(MEMBERS[t.assignee].name)}</span></td><td>${priChip(t.priority)}</td><td>${dueChip(t)}</td><td>${progChip(t) || '<span class="hint">None</span>'}</td></tr>`).join('') : `<tr><td colspan="6" class="empty">No tasks match.</td></tr>`;
  $('#listTally').textContent = `${rows.length} task${rows.length === 1 ? '' : 's'}`;
}

// Activity view

  const days = [];
  items.forEach(a => { const d = new Date(a.at); d.setHours(0, 0, 0, 0); const k = iso(d); let g = days.find(x => x.k === k); if (!g) { g = { k, d, items: [] }; days.push(g); } g.items.push(a); });

    <div class="pane-head"><h2>Activity</h2><div class="tools"><div class="seg" role="group" aria-label="Scope"><button type="button" data-act="act-scope" data-v="project" aria-pressed="${state.activityFilter === 'project'}">This project</button><button type="button" data-act="act-scope" data-v="all" aria-pressed="${state.activityFilter === 'all'}">All projects</button></div></div></div>

}

// Task mutations
function moveTask(id, status, opts = {}) {
  const t = task(id);
  if (!t || t.status === status) return;
  const from = t.status;
  t.status = status;
  log(`moved <b>${esc(t.title)}</b> from ${colName(from)} to <span class="t">${colName(status)}</span>`, t.project);
  save();
  state.flash = id;
  render();
  const lim = project().wip[status];
  const n = projTasks().filter(x => x.status === status).length;
  showToast(lim && n > lim ? `Moved to ${colName(status)}. This column is now ${n - lim} over its WIP limit.` : `Moved to ${colName(status)}.`, { label: 'Undo', fn: () => moveTask(id, from, { silent: true }) });
  if (opts.focus) { const el = document.querySelector(`[data-task="${id}"]`); if (el) el.focus(); }
}
function deleteTask(id) {
  const i = DB.tasks.findIndex(t => t.id === id);
  if (i < 0) return;
  const [t] = DB.tasks.splice(i, 1);
  log(`deleted <b>${esc(t.title)}</b>`, t.project);
  save(); render();
  showToast('Task deleted.', { label: 'Undo', fn: () => { DB.tasks.push(t); log(`restored <b>${esc(t.title)}</b>`, t.project); save(); render(); } });
}

// Task modal

}

    <div class="form-grid">

      <div class="field"><label for="fStatus">Status</label><select id="fStatus">${COLUMNS.map(c => `<option value="${c.id}"${t.status === c.id ? ' selected' : ''}>${c.name}</option>`).join('')}</select></div>
      <div class="field"><label for="fAssignee">Assignee</label><select id="fAssignee">${Object.keys(MEMBERS).map(m => `<option value="${m}"${t.assignee === m ? ' selected' : ''}>${esc(MEMBERS[m].name)}</option>`).join('')}</select></div>

      <div class="field full"><span class="label" id="clHead">Checklist${t.checklist.length ? ` (${t.checklist.filter(c => c.done).length}/${t.checklist.length})` : ''}</span>
        <ul class="check" aria-labelledby="clHead">${t.checklist.map(c => `<li class="${c.done ? 'done' : ''}"><input type="checkbox" id="ck-${c.id}" data-check="${c.id}"${c.done ? ' checked' : ''}><label for="ck-${c.id}">${esc(c.text)}</label><button type="button" class="rm" data-act="rm-check" data-id="${c.id}" aria-label="Remove ${esc(c.text)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></li>`).join('')}</ul>
        <div class="check-add"><input type="text" id="newCheck" aria-label="New checklist item" autocomplete="off"><button class="btn" type="button" data-act="add-check">Add</button></div>

    <div class="modal-foot">${isNew ? '' : `<button class="btn danger" type="button" data-act="delete-task">Delete</button>`}<span class="spacer"></span><button class="btn" type="button" data-act="close-task">Cancel</button><button class="btn primary" type="submit">${isNew ? 'Create task' : 'Save changes'}</button></div>

function readDialog() {
  const t = state.editing;
  t.title = $('#fTitle').value.trim();
  t.status = $('#fStatus').value; t.assignee = $('#fAssignee').value; t.start = $('#fStart').value; t.due = $('#fDue').value; t.priority = $('#fPriority').value; t.project = $('#fProject').value;
  t.labels = [...document.querySelectorAll('[data-label]:checked')].map(i => i.dataset.label);
}
function setErr(inputId, errId, msg) {
  const i = $('#' + inputId), e = $('#' + errId);
  e.textContent = msg; e.hidden = !msg;
  if (msg) i.setAttribute('aria-invalid', 'true'); else i.removeAttribute('aria-invalid');
  return !msg;
}
function saveDialog() {
  readDialog();
  const t = state.editing;
  const okT = setErr('fTitle', 'eTitle', t.title ? '' : 'Give the task a title.');
  const okD = setErr('fDue', 'eDue', !t.due ? 'Pick a due date.' : t.start && t.due < t.start ? 'Due date must be on or after the start date.' : '');
  if (!okT) { $('#fTitle').focus(); return; }
  if (!okD) { $('#fDue').focus(); return; }
  if (!t.start) t.start = t.due;
  if (!t.id) {
    const n = Math.max(100, ...DB.tasks.map(x => Number(x.id.slice(1)))) + 1;
    t.id = 't' + n; t.created = Date.now();
    DB.tasks.push(t);
    log(`created <b>${esc(t.title)}</b> in <span class="t">${colName(t.status)}</span>`, t.project);
    showToast('Task created.');
  } else {
    const old = task(t.id);
    const changes = [];
    if (old.title !== t.title) changes.push('renamed it to <b>' + esc(t.title) + '</b>');
    if (old.status !== t.status) changes.push(`moved it to <span class="t">${colName(t.status)}</span>`);
    if (old.assignee !== t.assignee) changes.push('assigned it to ' + esc(MEMBERS[t.assignee].name));
    if (old.due !== t.due) changes.push('changed the due date to ' + fmtDay.format(parse(t.due)));
    if (old.start !== t.start) changes.push('changed the start date to ' + fmtDay.format(parse(t.start)));
    if (old.priority !== t.priority) changes.push('set priority to ' + t.priority);
    if (old.project !== t.project) changes.push('moved it to project ' + esc(DB.projects.find(p => p.id === t.project).name));
    const addedL = t.labels.filter(l => !old.labels.includes(l)), removedL = old.labels.filter(l => !t.labels.includes(l));
    if (addedL.length) changes.push('added label ' + addedL.map(l => `<b>${l}</b>`).join(', '));
    if (removedL.length) changes.push('removed label ' + removedL.map(l => `<b>${l}</b>`).join(', '));
    const doneNow = t.checklist.filter(c => c.done).length, doneOld = old.checklist.filter(c => c.done).length;
    if (t.checklist.length !== old.checklist.length) changes.push(`updated the checklist (${t.checklist.length} items)`);
    else if (doneNow > doneOld) changes.push(`completed ${doneNow - doneOld} checklist item${doneNow - doneOld === 1 ? '' : 's'}`);
    else if (doneNow < doneOld) changes.push(`reopened ${doneOld - doneNow} checklist item${doneOld - doneNow === 1 ? '' : 's'}`);
    Object.assign(old, t);
    if (changes.length) { log(`edited <b>${esc(old.title)}</b>: ${changes.join('; ')}`, old.project); showToast('Changes saved.'); }
  }

  state.flash = t.id;
  if (t.project !== DB.project) DB.project = t.project;
  closeDialog();

}
function closeDialog() { const d = $('#taskDialog'); if (d.open) d.close(); state.editing = null; }

// Toast
let toastTimer, toastAction;
function showToast(msg, action) {
  const el = $('#toast');
  toastAction = action ? action.fn : null;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" data-act="toast-action">${esc(action.label)}</button>` : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $('#toast').hidden = true; }

// Mobile drawer
function setMenu(open, focus = true) {
  $('#sidebar').classList.toggle('open', open);
  $('#scrim').classList.toggle('open', open);
  $('#menuBtn').setAttribute('aria-expanded', String(open));
  $('#menuBtn').setAttribute('aria-label', open ? 'Close menu' : 'Open menu');

// Click handling
let suppressClick = false;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act], [data-task], [data-row]');
  if (!t) return;
  if (suppressClick) { suppressClick = false; return; }
  const act = t.dataset.act;
  if (t.dataset.task && !act) { openTask(t.dataset.task); return; }
  if (t.dataset.row && !act) { openTask(t.dataset.row); return; }
  if (act === 'new-task') openTask(null, t.dataset.status);
  else if (act === 'open-task') openTask(t.dataset.id);
  else if (act === 'close-task') closeDialog();
  else if (act === 'delete-task') { const id = state.editing.id; closeDialog(); deleteTask(id); }
  else if (act === 'add-check') addCheck();
  else if (act === 'rm-check') { readDialog(); state.editing.checklist = state.editing.checklist.filter(c => c.id !== t.dataset.id); renderDialog(); $('#newCheck').focus(); }
  else if (act === 'toggle-menu') setMenu(!$('#sidebar').classList.contains('open'));
  else if (act === 'close-menu') setMenu(false);
  else if (act === 'toast-action') { hideToast(); if (toastAction) toastAction(); }
  else if (act === 'sort') { const k = t.dataset.key; if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = 1; } listRows(); document.querySelectorAll('th').forEach(h => h.removeAttribute('aria-sort')); const th = t.closest('th'); th.setAttribute('aria-sort', state.sortDir > 0 ? 'ascending' : 'descending'); document.querySelectorAll('th .arrow').forEach(a => a.textContent = ''); t.querySelector('.arrow').textContent = state.sortDir > 0 ? '▲' : '▼'; }
  else if (act === 'act-scope') { state.activityFilter = t.dataset.v; render(); document.querySelector(`[data-act="act-scope"][data-v="${t.dataset.v}"]`).focus(); }
  else if (act === 'reset') { localStorage.removeItem(STORE); DB = seed(); save(); state.view = 'board'; location.hash = 'board'; render(); showToast('Data reset to the starting workspace.'); }
});
function addCheck() {
  const input = $('#newCheck'), text = input.value.trim();
  if (!text) { input.focus(); return; }
  readDialog();
  state.editing.checklist.push({ id: 'c' + Date.now().toString(36), text, done: false });
  renderDialog();
  $('#newCheck').focus();
}

// Keyboard: Enter on cards and rows opens, Enter in checklist box adds
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sidebar').classList.contains('open')) setMenu(false);
  if (e.key === 'Enter' && e.target.id === 'newCheck') { e.preventDefault(); addCheck(); }
  if ((e.key === 'Enter' || e.key === ' ') && (e.target.dataset.task || e.target.dataset.row)) { e.preventDefault(); openTask(e.target.dataset.task || e.target.dataset.row); }
});

// Change handling
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'projectPick') { DB.project = el.value; save(); render(); }
  else if (el.id === 'boardFilter') { state.boardFilter = el.value; render(); $('#boardFilter').focus(); }
  else if (el.id === 'listFilter') { state.listFilter = el.value; listRows(); }
  else if (el.dataset.check) { const c = state.editing.checklist.find(x => x.id === el.dataset.check); if (c) { c.done = el.checked; el.closest('li').classList.toggle('done', c.done); $('#clHead').textContent = `Checklist (${state.editing.checklist.filter(x => x.done).length}/${state.editing.checklist.length})`; } }
  else if (el.dataset.wip) { const v = Math.max(0, Math.min(20, Number(el.value) || 0)); project().wip[el.dataset.wip] = v || undefined; log(`set the ${colName(el.dataset.wip)} limit to ${v || 'none'}`); save(); showToast('Limit saved.'); }
});
document.addEventListener('input', e => { if (e.target.id === 'listSearch') { state.search = e.target.value; listRows(); } });

// Pointer drag and drop between board columns
let drag = null;
const view = $('#view');
view.addEventListener('pointerdown', e => {
  const card = e.target.closest('[data-task]');
  if (!card || e.button !== 0) return;
  drag = { id: card.dataset.task, card, x0: e.clientX, y0: e.clientY, active: false, ghost: null, col: null };
});
function dragMove(e) {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.active) {
    if (Math.hypot(dx, dy) < 6) return;
    drag.active = true;
    const r = drag.card.getBoundingClientRect();
    drag.ox = e.clientX - r.left; drag.oy = e.clientY - r.top;
    const g = drag.card.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('flash'); g.removeAttribute('tabindex'); g.style.width = r.width + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.card.classList.add('drag');
    document.body.classList.add('dragging');
    try { drag.card.setPointerCapture(e.pointerId); } catch (err) { }
  }
  drag.ghost.style.left = (e.clientX - drag.ox) + 'px';
  drag.ghost.style.top = (e.clientY - drag.oy) + 'px';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const col = under && under.closest('[data-col]');
  if (col !== drag.col) { if (drag.col) drag.col.classList.remove('over'); drag.col = col; if (col) col.classList.add('over'); }
  const board = $('#board');
  if (board) { const br = board.getBoundingClientRect(); if (e.clientX > br.right - 40) board.scrollLeft += 12; else if (e.clientX < br.left + 40) board.scrollLeft -= 12; }
  e.preventDefault();
}
function dragEnd(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.active) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  if (d.ghost) d.ghost.remove();
  d.card.classList.remove('drag');
  document.body.classList.remove('dragging');
  if (d.col) d.col.classList.remove('over');
  if (!cancelled && d.col) moveTask(d.id, d.col.dataset.col, { focus: true });
}
document.addEventListener('pointermove', dragMove);
document.addEventListener('pointerup', e => dragEnd(e, false));
document.addEventListener('pointercancel', e => dragEnd(e, true));

// Nav links close the drawer and move focus to the content
$('#nav').addEventListener('click', e => { if (e.target.closest('a')) { setMenu(false, false); setTimeout(() => $('#view').focus({ preventScroll: true }), 0); } });

// Hash routing
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (TITLES[v] && v !== state.view) { state.view = v; hideToast(); render(); $('#view').scrollTop = 0; }
});

// Start the app
load();
const startView = location.hash.slice(1);
if (TITLES[startView]) state.view = startView;
setMenu(false, false);
render();
</script>
</body>
